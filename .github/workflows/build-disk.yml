---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  # Freizzite: PR/push triggers intentionally disabled — disk builds consume
  # the published :latest images and are run on demand via dispatch only.

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # overridden per variant in Prepare environment
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        # Freizzite: one ISO per published variant
        variant:
          - name: freizzite-dx-nvidia
            iso-config: ./disk_config/iso.toml
          - name: freizzite-deck
            iso-config: ./disk_config/iso-deck.toml
        # qcow2 disabled until runner disk space issues are resolved
        # (re-add "qcow2" to restore upstream behavior)
        disk-type: ["anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          # Freizzite: image name comes from the variant matrix
          echo "IMAGE_NAME=${{ matrix.variant.name }}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Freizzite: work around occasional timing issue of this running before
      # containers are fully ready
      - name: Pre-pull container image
        run: |
          sudo podman pull ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }} || sleep 5m

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@30960621b85c9e76c653082f9ef4cab5a10210d5 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && matrix.variant.iso-config || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --rootfs btrfs --use-librepo=True

      # Freizzite: name artifacts after the variant so multiple ISOs can
      # coexist in one release/artifact listing
      - name: Rename ISO to variant name
        if: matrix.disk-type == 'anaconda-iso'
        run: |
          mkdir -p ${{ steps.build.outputs.output-directory }}/iso
          mv ${{ steps.build.outputs.output-directory }}/bootiso/install.iso \
             ${{ steps.build.outputs.output-directory }}/iso/${{ env.IMAGE_NAME }}.iso

      - name: Rename manifest to variant name
        if: matrix.disk-type == 'anaconda-iso'
        run: |
          mkdir -p ${{ steps.build.outputs.output-directory }}/iso
          # Find and rename the manifest file to match the ISO naming convention
          find ${{ steps.build.outputs.output-directory }} -name '*.manifest' -type f \
            -exec mv {} ${{ steps.build.outputs.output-directory }}/iso/${{ env.IMAGE_NAME }}.iso.manifest \;

      - name: Generate checksums
        if: matrix.disk-type == 'anaconda-iso'
        run: |
          mkdir -p ${{ steps.build.outputs.output-directory }}/iso
          cd ${{ steps.build.outputs.output-directory }}/iso
          # Generate SHA256 checksum (both file names)
          sha256sum *.iso > ${{ env.IMAGE_NAME }}.iso.sha256sum
          cp ${{ env.IMAGE_NAME }}.iso.sha256sum ${{ env.IMAGE_NAME }}.iso.shasum
          # Generate MD5 checksum
          md5sum *.iso > ${{ env.IMAGE_NAME }}.iso.md5sum

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Freizzite: name per variant so matrix jobs don't clobber each other
          name: ${{ matrix.variant.name }}-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
