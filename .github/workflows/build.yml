---
name: Build container image
on:
  pull_request:
    branches:
      - main
  # Freirora: build after pre-commit passes on main instead of on raw push
  workflow_run:
    workflows: ["pre-commit"]
    types: [completed]
    branches: [main]
  schedule:
    # Cheap upstream poll (~40s). The `check` job resolves
    # ghcr.io/ublue-os/aurora-dx:stable and compares it against the label on
    # the image we last published; a full build only happens if something
    # actually moved. Minute :37 is deliberate -- scheduled runs at :00 have
    # been observed queueing 60-104 minutes late.
    - cron: "37 */6 * * *"
    # Unconditional rebuild, bypassing the gate entirely. Two jobs: it picks up
    # floating build-time deps the gate cannot see (terra, COPRs, the Mozilla
    # and 1Password repos, ~120 dnf packages), and it guarantees a build even
    # if the gate logic itself breaks in the "always skip" direction.
    # Must stay byte-identical to FORCE_CRON in the check job below.
    - cron: "0 2 * * TUE"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # Only PR pushes should cancel. Scheduled polls share this group with
  # main-branch builds, and builds take 35-40min: cancelling them means the
  # build never publishes, so the gate keeps seeing the stale label and
  # rebuilds -- a livelock that burns runner time and ships nothing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Freirora: decide whether a build is warranted before spending 35-40min on
  # one. State lives in labels on the image we already publish, so there is no
  # cache, no state file and no extra secret to keep in sync.
  check:
    name: Check for upstream changes
    runs-on: ubuntu-24.04
    # Only run if not triggered by workflow_run, OR if workflow_run was successful
    if: >
      github.event_name != 'workflow_run' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: read
      packages: read

    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      base_digest: ${{ steps.gate.outputs.base_digest }}

    env:
      BASE_REF: "ghcr.io/ublue-os/aurora-dx:stable"
      # Derived rather than hardcoded: the labels on the published image still
      # carry a stale org name from the last move, and this should not be a
      # second place that has to be remembered.
      PUBLISHED_REF: "ghcr.io/${{ github.repository }}:latest"
      LABEL_NS: "io.github.freiheit.build"
      # Rebuild at least weekly even if the base has not moved, so floating
      # package repos (Firefox, 1Password, terra, COPRs) do not go stale.
      MAX_AGE_HOURS: "168"
      MIN_INTERVAL_HOURS: "0"
      # Must match the second `schedule` cron above exactly; github.event.schedule
      # hands back the literal cron string.
      FORCE_CRON: "0 2 * * TUE"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Decide whether to build
        id: gate
        env:
          REG_USER: ${{ github.actor }}
          REG_PASS: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          # A code change, a manual dispatch or a PR must always build; so must
          # the weekly safety-net cron, which deliberately bypasses the gate.
          FORCE=false
          FORCE_REASON=""
          case "${EVENT_NAME}" in
            workflow_dispatch | pull_request | workflow_run)
              FORCE=true
              FORCE_REASON="triggered by ${EVENT_NAME}"
              ;;
          esac
          if [ "${EVENT_NAME}" = "schedule" ] && [ "${EVENT_SCHEDULE}" = "${FORCE_CRON}" ]; then
            FORCE=true
            FORCE_REASON="weekly safety-net cron (${FORCE_CRON})"
          fi
          export FORCE FORCE_REASON

          # GHCR refs must be lowercase; github.repository preserves the
          # owner's casing.
          PUBLISHED_REF="${PUBLISHED_REF,,}"
          export PUBLISHED_REF

          result="$(.github/scripts/upstream-gate.sh)"
          echo "gate: ${result}"

          build="$(jq -r '.build' <<<"${result}")"
          reason="$(jq -r '.reason' <<<"${result}")"
          digest="$(jq -r '.base_digest' <<<"${result}")"

          echo "should_build=${build}" >> "${GITHUB_OUTPUT}"
          echo "base_digest=${digest}" >> "${GITHUB_OUTPUT}"

          if [ "${build}" = "true" ]; then
            echo "### Building - ${reason}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### Skipping - ${reason}" >> "${GITHUB_STEP_SUMMARY}"
          fi

  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04
    needs: check
    if: needs.check.outputs.should_build == 'true'

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      # Digest the gate resolved. The build pins the base to exactly this, so
      # the label we record cannot drift from what was actually built.
      BASE_DIGEST: ${{ needs.check.outputs.base_digest }}

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          set -euo pipefail

          # Pin the base to the digest the gate resolved. Without this,
          # `podman build --pull=newer` re-resolves :stable at build time and
          # could bake in a different digest than the one we are about to
          # record, leaving the gate permanently comparing against the wrong
          # value. BUILD_BASE_DIGEST is what the Justfile writes as a label.
          if [ -n "${BASE_DIGEST}" ]; then
            export BASE_TAG="stable@${BASE_DIGEST}"
            export BUILD_BASE_DIGEST="${BASE_DIGEST}"
          else
            export BASE_TAG="stable"
            export BUILD_BASE_DIGEST=""
            echo "::warning::upstream digest unresolved; building against the floating :stable tag"
          fi

          sudo -E $(command -v just) build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          sudo -E $(command -v just) ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    sudo -E $(command -v just) rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          sudo -E $(command -v just) tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            sudo -E podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        # https://github.com/containers/container-libs/issues/388
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
