---
name: Build container image
on:
  pull_request:
    branches:
      - main
  # Freizzite: build after pre-commit passes on main instead of on raw push
  workflow_run:
    workflows: ["pre-commit"]
    types: [completed]
    branches: [main]
  schedule:
    # Cheap upstream poll (~40s), hourly through the working day. The `matrix`
    # job resolves each variant's upstream base digest and drops the targets
    # that have not moved, so a full build only runs when something changed.
    # Minute :17 is deliberate -- scheduled runs at :00 queue worst.
    - cron: "17 11-20 * * *" # hourly, 11am-8pm US/Pacific
      timezone: "America/Los_Angeles"
    # Unconditional rebuild of every target, bypassing the gate entirely. It
    # picks up floating build-time deps the gate cannot see (terra, COPRs, the
    # Mozilla/1Password/Microsoft repos, ~120 dnf packages), and guarantees a
    # build even if the gate itself breaks in the "always skip" direction.
    # Must stay byte-identical to FORCE_CRON in the matrix job.
    - cron: "40 5 * * 1"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # Only PR pushes should cancel. Scheduled polls share this group with
  # main-branch builds, and builds run 35min-3.5h: cancelling them means the
  # build never publishes, so the gate keeps seeing the stale label and
  # rebuilds -- a livelock that burns runner time and ships nothing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Freizzite: compute the build matrix. A `testing` stream is added for a
  # variant only when its upstream base publishes a :testing tag. On top of
  # that, each variant/stream target is gated on whether its upstream base has
  # actually moved since we last published -- see .github/scripts/upstream-gate.sh.
  # Targets with nothing to do are dropped, so a quiet poll builds nothing.
  matrix:
    name: Determine build matrix
    runs-on: ubuntu-latest
    # Mirror build_push: on a workflow_run trigger, only proceed if pre-commit
    # succeeded. build_push depends on this job, so gating here gates both.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: read
    outputs:
      targets: ${{ steps.gen.outputs.targets }}
      any: ${{ steps.gen.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute variant/stream targets
        id: gen
        env:
          # "<freizzite-image>|<upstream-base>|<description>", one active variant
          # per line. The description becomes IMAGE_DESC for that variant (env
          # beats dotenv in the Justfile, so no image-template.env change).
          VARIANTS: |
            freizzite-dx-nvidia|bazzite-dx-nvidia|Freizzite - customized Bazzite (dx-nvidia: developer tools + NVIDIA drivers)
            freizzite-deck|bazzite-deck|Freizzite - customized Bazzite (deck: Steam Deck / handheld)
            # freizzite|bazzite|Freizzite - customized Bazzite
            # freizzite-nvidia|bazzite-nvidia|Freizzite - customized Bazzite (NVIDIA drivers)
            # freizzite-nvidia-open|bazzite-nvidia-open|Freizzite - customized Bazzite (open NVIDIA drivers)
          LABEL_NS: "io.github.freiheit.build"
          # Rebuild at least every 3 days even if the base has not moved, so
          # floating package repos (Firefox, 1Password, vscode, terra, COPRs)
          # do not go stale.
          MAX_AGE_HOURS: "72"
          MIN_INTERVAL_HOURS_STABLE: "0"
          # bazzite's :testing moves 1-5x/day. Without a floor, gating that
          # stream would build *more* often than the fixed schedule it
          # replaces; 4h caps it at 6 builds/day.
          MIN_INTERVAL_HOURS_TESTING: "4"
          # Must match the weekly `schedule` cron above exactly.
          FORCE_CRON: "40 5 * * 1"
          REG_USER: ${{ github.actor }}
          REG_PASS: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          # A code change, a manual dispatch or a PR must always build every
          # target; so must the weekly safety-net cron, which bypasses the gate.
          FORCE=false
          FORCE_REASON=""
          case "${EVENT_NAME}" in
            workflow_dispatch | pull_request | workflow_run)
              FORCE=true
              FORCE_REASON="triggered by ${EVENT_NAME}"
              ;;
          esac
          if [ "${EVENT_NAME}" = "schedule" ] && [ "${EVENT_SCHEDULE}" = "${FORCE_CRON}" ]; then
            FORCE=true
            FORCE_REASON="weekly safety-net cron (${FORCE_CRON})"
          fi
          export FORCE FORCE_REASON HEAD_SHA LABEL_NS REG_USER REG_PASS MAX_AGE_HOURS

          targets=()
          while IFS='|' read -r name base desc; do
            name="${name//[[:space:]]/}"
            [[ -z "${name}" || "${name}" == \#* ]] && continue
            base="${base//[[:space:]]/}"
            # trim leading/trailing whitespace from the description
            desc="${desc#"${desc%%[![:space:]]*}"}"
            desc="${desc%"${desc##*[![:space:]]}"}"

            for stream in stable testing; do
              if [ "${stream}" = "testing" ]; then
                default_tag=testing
                min_interval="${MIN_INTERVAL_HOURS_TESTING}"
              else
                default_tag=latest
                min_interval="${MIN_INTERVAL_HOURS_STABLE}"
              fi

              # The gate doubles as the upstream :testing existence probe it
              # replaces: an unresolvable-because-404 base means the stream does
              # not exist for this variant. It distinguishes that from a
              # transient registry fault, which the old `imagetools inspect
              # >/dev/null 2>&1` could not.
              result="$(BASE_REF="ghcr.io/ublue-os/${base}:${stream}" \
                        PUBLISHED_REF="ghcr.io/${OWNER}/${name}:${default_tag}" \
                        MIN_INTERVAL_HOURS="${min_interval}" \
                        .github/scripts/upstream-gate.sh)"

              build="$(jq -r '.build' <<<"${result}")"
              reason="$(jq -r '.reason' <<<"${result}")"
              digest="$(jq -r '.base_digest' <<<"${result}")"
              absent="$(jq -r '.stream_absent' <<<"${result}")"

              if [ "${absent}" = "true" ]; then
                echo "- \`${name}\` (${stream}): stream does not exist upstream" >> "${GITHUB_STEP_SUMMARY}"
                continue
              fi
              if [ "${build}" != "true" ]; then
                echo "- \`${name}\` (${stream}): **skip** - ${reason}" >> "${GITHUB_STEP_SUMMARY}"
                continue
              fi

              echo "- \`${name}\` (${stream}): **build** - ${reason}" >> "${GITHUB_STEP_SUMMARY}"
              targets+=("$(jq -cn \
                --arg name "${name}" --arg base "${base}" --arg stream "${stream}" \
                --arg digest "${digest}" --arg default_tag "${default_tag}" --arg desc "${desc}" \
                '{name: $name, base: $base, base_tag: $stream, base_digest: $digest,
                  default_tag: $default_tag, stream: $stream, image_desc: $desc}')")
            done
          done <<< "${VARIANTS}"

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "targets=[]" >> "${GITHUB_OUTPUT}"
            echo "any=false" >> "${GITHUB_OUTPUT}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "**Nothing to build.**" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          printf -v joined '%s,' "${targets[@]}"
          echo "targets=[${joined%,}]" >> "${GITHUB_OUTPUT}"
          echo "any=true" >> "${GITHUB_OUTPUT}"

  build_push:
    name: ${{ matrix.target.name }} (${{ matrix.target.stream }})
    needs: matrix
    # A matrix expression evaluating to [] is a hard error ("Matrix vector
    # 'target' does not contain any values"), which would paint a red X on
    # every quiet poll. Guarding on `any` makes the nothing-to-do case a clean
    # grey "Skipped" instead.
    if: needs.matrix.outputs.any == 'true'
    runs-on: ubuntu-24.04

    # Freizzite: targets come from the `matrix` job above. IMAGE_NAME/BASE_IMAGE/
    # BUILD_VARIANT/BASE_TAG/DEFAULT_TAG/IMAGE_DESC override the image-template.env
    # defaults (env beats dotenv in the Justfile recipes). STREAM selects
    # stable/testing.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    env:
      IMAGE_NAME: ${{ matrix.target.name }}
      BASE_IMAGE: ${{ matrix.target.base }}
      BUILD_VARIANT: ${{ matrix.target.base }}
      BASE_TAG: ${{ matrix.target.base_tag }}
      DEFAULT_TAG: ${{ matrix.target.default_tag }}
      STREAM: ${{ matrix.target.stream }}
      IMAGE_DESC: ${{ matrix.target.image_desc }}
      # Digest the gate resolved for this target. The build pins the base to
      # exactly this, so the label we record cannot drift from what was built.
      BASE_DIGEST: ${{ matrix.target.base_digest }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          set -euo pipefail

          # Pin the base to the digest the gate resolved. Without this,
          # `podman build --pull=newer` re-resolves the floating stream tag at
          # build time and could bake in a different digest than the one we are
          # about to record, leaving the gate comparing against the wrong value.
          # BUILD_BASE_DIGEST is what the Justfile writes as a label.
          if [ -n "${BASE_DIGEST}" ]; then
            export BASE_TAG="${STREAM}@${BASE_DIGEST}"
            export BUILD_BASE_DIGEST="${BASE_DIGEST}"
          else
            export BASE_TAG="${STREAM}"
            export BUILD_BASE_DIGEST=""
            echo "::warning::upstream digest unresolved; building against the floating :${STREAM} tag"
          fi

          sudo -E $(command -v just) build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # This is optional, this provides smaller delta updates
      # Freizzite: seeded variant reuses the previous published image's chunk
      # layout so unchanged content keeps identical layer digests
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          sudo -E $(command -v just) ostree-rechunk-seeded \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    sudo -E $(command -v just) rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          # Freizzite: the testing stream must not publish the stream-agnostic
          # tags (bare YYYYMMDD / YYYYMMDD-<sha>) that generate-build-tags emits,
          # or they would collide with the stable stream on the same commit.
          # Keep only testing-prefixed tags for that stream.
          if [[ "${STREAM:-stable}" == "testing" ]]; then
            filtered=()
            for t in ${alias_tags}; do
              [[ "${t}" == testing* ]] && filtered+=("${t}")
            done
            alias_tags="${filtered[*]}"
          fi

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          sudo -E $(command -v just) tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          # Freizzite: retry transient GHCR errors (e.g. 504 mid-push) instead
          # of failing the whole build
          for tag in ${ALIAS_TAGS}; do
            for attempt in 1 2 3; do
              if sudo -E podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}; then
                break
              elif [[ "${attempt}" -lt 3 ]]; then
                echo "Push of ${tag} failed (attempt ${attempt}); retrying in 30s..." >&2
                sleep 30
              else
                exit 1
              fi
            done
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      # Freizzite: publish the per-variant Artifact Hub repository-metadata file
      # to the `artifacthub.io` OCI tag so package ownership is claimed
      # automatically (no manual control-panel verification step). One metadata
      # file per package lives at artifacthub/<image-name>.yml; variants without
      # one (e.g. before their ArtifactHub repo/ID exists) are skipped. oras
      # reuses the ghcr credentials from the docker login step above. Runs only
      # on the stable stream — the metadata is per package, not per tag.
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.target.stream == 'stable'

      - name: Publish Artifact Hub repository metadata
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.target.stream == 'stable'
        run: |
          set -euo pipefail
          meta="artifacthub/${IMAGE_NAME}.yml"
          if [[ ! -f "${meta}" ]]; then
            echo "No Artifact Hub metadata for ${IMAGE_NAME} (${meta}); skipping."
            exit 0
          fi
          oras push \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${meta}:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"
